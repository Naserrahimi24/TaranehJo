services:
  - type: web
    name: taranehjo
    env: node
    branch: main
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_FROM
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ZARINPAL_MERCHANT
        sync: false
